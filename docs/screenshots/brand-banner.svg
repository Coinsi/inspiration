    <radialGradient id="glow"><stop stop-color="#86ab88" stop-opacity=".25"/><stop offset="1" stop-color="#86ab88" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#dcca95" stop-opacity="0"/><stop offset=".55" stop-color="#dcca95" stop-opacity=".7"/><stop offset="1" stop-color="#dcca95" stop-opacity=".1"/></linearGradient>
  </defs>
  <rect width="1440" height="360" rx="18" fill="url(#bg)"/>
  <ellipse cx="1090" cy="190" rx="420" ry="330" fill="url(#glow)"/>
