[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspiration-wise-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.18", "pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "sqlalchemy>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
