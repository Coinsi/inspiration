[project]
name = "inspiration-backend"
version = "0.1.0"
description = "Inspiration —— 影视/动漫 AIGC 资产管理与生产平台 (后端)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "celery>=5.3",
    "redis>=5.0",
    "minio>=7.2",
    "pgvector>=0.2.5",
    "pillow>=11.0",
    "PyYAML>=6.0,<7",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
