limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# This server is published on loopback only, behind host-mode OpenResty.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $external_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 260m;
    client_body_timeout 120s;

    # Personal trial: create users through the server until registration is opened.
    location = /api/v1/auth/register { return 403; }

    location = /api/v1/auth/login {
        client_max_body_size 16k;
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_proto;
    }

    # Google registration has its own server-side switch; password signup stays closed.
    location ^~ /api/v1/auth/google/ {
        client_max_body_size 16k;
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        # OAuth callbacks contain a short-lived authorization code.
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_proto;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_proto;
    }

    location ~ "^/media/.*\.[0-9a-f]{12}\.(mp4|webp)$" {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ /index.html; }
}
